[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ameme-sync-protocol"
version = "0.1.0"
description = "Deterministic in-memory protocol simulator for Ameme SYNC-01"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
