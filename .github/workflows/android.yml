name: Android

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/contracts/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "packages/contracts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4.4.2
      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          fi
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Unit tests, lint, and installable artifacts
        run: |
          ./gradlew --no-daemon \
            testDebugUnitTest testReleaseUnitTest \
            lintDebug lintRelease \
            assembleDebug assembleRelease assembleDebugAndroidTest

  device:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4.4.2
      - name: Install API 36 16 KB emulator
        shell: bash
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$ANDROID_HOME/cmdline-tools/12.0/bin/sdkmanager"
          fi
          test -x "$sdkmanager_path"
          avdmanager_path="${sdkmanager_path%/sdkmanager}/avdmanager"
          test -x "$avdmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis_ps16k;x86_64"
          echo no | "$avdmanager_path" create avd \
            --force \
            --name ameme-ci-api36-16k \
            --package "system-images;android-36;google_apis_ps16k;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Run device and accessibility contract tests
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm
          emulator \
            -avd ameme-ci-api36-16k \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            >"$RUNNER_TEMP/ameme-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" >/dev/null 2>&1 || true' EXIT
          adb wait-for-device
          for attempt in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "16384"
          adb shell settings put system font_scale 1.3
          ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload Android device evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ameme-android-device-evidence
          path: |
            apps/android/app/build/reports/androidTests/connected/debug/
            ${{ runner.temp }}/ameme-emulator.log
          if-no-files-found: warn
          retention-days: 14
