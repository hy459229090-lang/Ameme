name: workspace-health

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  workspace-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-dev.txt
      - name: Run complete no-network validation baseline
        run: python scripts/validation/run_workspace_validation.py
      - name: Compile Python sources
        run: python -m compileall -q scripts research packages services tests
