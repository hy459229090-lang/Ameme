name: workspace-health

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check workspace governance
        run: python scripts/governance/check_workspace.py
      - name: Compile Python scripts
        run: python -m compileall -q scripts research
