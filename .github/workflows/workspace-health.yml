name: workspace-health

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-dev.txt
      - name: Check workspace governance
        run: python scripts/governance/check_workspace.py
      - name: Check local documentation links
        run: python scripts/governance/check_markdown_links.py
      - name: Validate Ameme Skill package
        run: python scripts/validation/validate_ameme_skill.py
      - name: Compile Python scripts
        run: python -m compileall -q scripts research

  contract-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-dev.txt
      - name: Run contract quality baseline
        run: python scripts/validation/run_contract_quality.py
